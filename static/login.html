<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Login</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-100 to-indigo-200 min-h-screen flex items-center justify-center">

<div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm">
  <h1 class="text-2xl font-bold text-center mb-6">🔐 เข้าสู่ระบบ</h1>

  <!-- username -->
  <input id="username" placeholder="ชื่อผู้ใช้"
    class="w-full border rounded p-2 mb-3 focus:ring-2 focus:ring-blue-400">

  <!-- password -->
  <input id="password" type="password" placeholder="รหัสผ่าน"
    class="w-full border rounded p-2 mb-4 focus:ring-2 focus:ring-blue-400">

  <!-- login -->
  <button onclick="login()"
    class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition mb-3">
    เข้าสู่ระบบ
  </button>

  <!-- register -->
  <button onclick="registerUser()"
    class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition">
    สมัครผู้ใช้ใหม่
  </button>

  <p id="msg" class="text-center text-red-500 mt-4 hidden"></p>
</div>

<script>
const msg = document.getElementById("msg")

function showError(text){
  msg.innerText = "❌ " + text
  msg.classList.remove("hidden")
}

// ---------------- LOGIN ----------------
function login(){
  msg.classList.add("hidden")

  fetch("/login",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      username: username.value.trim(),
      password: password.value
    })
  })
  .then(async r=>{
    if(!r.ok){
      const e = await r.json().catch(()=>({detail:"Login ไม่สำเร็จ"}))
      throw e
    }
    return r.json()
  })
  .then(()=>{
    localStorage.setItem("username", username.value.trim())
    location.replace("/ot")
  })
  .catch(e=>{
    showError(e.detail || "Login ไม่สำเร็จ")
  })
}

// ---------------- REGISTER ----------------
function registerUser(){
  msg.classList.add("hidden")

  fetch("/register",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      username: username.value.trim(),
      password: password.value
    })
  })
  .then(async r=>{
    if(!r.ok){
      const e = await r.json().catch(()=>({detail:"สมัครไม่สำเร็จ"}))
      throw e
    }
    return r.json()
  })
  .then(()=>{
    alert("✅ สมัครสำเร็จ สามารถ login ได้ทันที")
  })
  .catch(e=>{
    showError(e.detail || "สมัครไม่สำเร็จ")
  })
}
</script>

</body>
</html>
