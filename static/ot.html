<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ระบบบันทึก OT</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen p-6">

<button onclick="logout()"
 class="fixed top-4 right-4 bg-red-500 text-white px-4 py-2 rounded">
Logout
</button>

<div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow">

<h1 class="text-2xl font-bold text-center mb-4">📊 ระบบบันทึก OT</h1>
<p class="text-center mb-4">ผู้ใช้: <b id="user"></b></p>

<!-- ===== Form ===== -->
<div class="grid md:grid-cols-2 gap-4">

<div>
<label>วันที่</label>
<input id="date" type="date" class="w-full border p-2 rounded">
</div>

<div>
<label>ประเภทวัน</label>
<select id="type" class="w-full border p-2 rounded">
<option value="weekday">จันทร์ - ศุกร์</option>
<option value="weekend">เสาร์ / อาทิตย์ / นักขัตฤกษ์</option>
</select>
</div>

<div id="startBox" class="hidden">
<label>เวลาเข้า</label>
<div class="flex gap-2">
<select id="in_h"></select>
<select id="in_m1"></select>
<select id="in_m2"></select>
</div>
</div>

<div>
<label>เวลาเลิกงาน</label>
<div class="flex gap-2">
<select id="out_h"></select>
<select id="out_m1"></select>
<select id="out_m2"></select>
</div>
</div>

</div>

<div class="flex gap-3 mt-4">
<button onclick="saveOT()" class="bg-blue-600 text-white px-4 py-2 rounded">
บันทึก OT
</button>

<button onclick="clearAll()" class="bg-red-500 text-white px-4 py-2 rounded">
ล้าง OT ทั้งหมด
</button>
</div>

<hr class="my-6">

<!-- ===== Summary ===== -->
<h2 class="text-xl font-bold mb-2">📅 สรุป OT รายเดือน</h2>

<div class="flex gap-3 mb-4">
<input id="month" type="month" class="border p-2 rounded">
<button onclick="loadSummary()" class="bg-green-600 text-white px-4 py-2 rounded">
ดูสรุป
</button>

<button onclick="openCalc()" class="bg-purple-600 text-white px-4 py-2 rounded">
คำนวณเงิน OT
</button>
</div>

<div id="summary"></div>
</div>

<!-- ===== Modal ===== -->
<div id="calcModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center">
  <div class="bg-white p-6 rounded-xl w-80">
    <h3 class="text-lg font-bold mb-3">💰 คำนวณเงิน OT</h3>

    <label>ฐานเงินเดือน</label>
    <input id="salary" type="number" class="w-full border p-2 mb-2">

    <p>OT 1 แรง: <b id="m_ot1">0</b> ชม.</p>
    <p>OT 1.5 แรง: <b id="m_ot15">0</b> ชม.</p>
    <p>OT 3 แรง: <b id="m_ot3">0</b> ชม.</p>

    <hr class="my-2">

    <p class="font-bold">รวมเงิน OT: <span id="total_ot">0</span> บาท</p>

    <div class="flex gap-2 mt-4">
      <button onclick="calculateMoney()" class="bg-green-600 text-white px-4 py-2 rounded">
        คำนวณ
      </button>
      <button onclick="closeCalc()" class="bg-gray-400 text-white px-4 py-2 rounded">
        ปิด
      </button>
    </div>
  </div>
</div>

<script>
/* ===== Guard ===== */
const username = localStorage.getItem("username")
if(!username) location.replace("/")
user.innerText = username

/* ===== Time Select ===== */
const hours = [...Array(24).keys()]
const mins  = [...Array(10).keys()]

function fill(id, arr){
  const el = document.getElementById(id)
  el.innerHTML = `<option value="">--</option>`
  arr.forEach(v=> el.innerHTML += `<option>${v}</option>`)
}

["out_h","in_h"].forEach(i=>fill(i,hours))
;["out_m1","out_m2","in_m1","in_m2"].forEach(i=>fill(i,mins))

type.onchange = ()=> startBox.classList.toggle("hidden", type.value==="weekday")

function getTime(h,m1,m2){
  if(h===""||m1===""||m2==="") return null
  return `${String(h).padStart(2,"0")}:${m1}${m2}`
}

/* ===== Save OT ===== */
function saveOT(){
  if(!date.value) return alert("เลือกวันที่")
  const out = getTime(out_h.value,out_m1.value,out_m2.value)
  if(!out) return alert("เลือกเวลาเลิกงาน")

  const payload = { username, date:date.value, day:type.value, out }

  if(type.value==="weekend"){
    const inn = getTime(in_h.value,in_m1.value,in_m2.value)
    if(!inn) return alert("เลือกเวลาเข้า")
    payload.in = inn
  }

  fetch("/save_ot",{method:"POST",headers:{ "Content-Type":"application/json" },body:JSON.stringify(payload)})
  .then(()=>alert("✅ บันทึกเรียบร้อย"))
}

/* ===== Summary ===== */
let sum1=0,sum15=0,sum3=0

function loadSummary(){
  if(!month.value) return alert("เลือกเดือน")
  fetch(`/summary/${username}/${month.value}`)
  .then(r=>r.json())
  .then(d=>{
    sum1=d.total.ot1
    sum15=d.total.ot15
    sum3=d.total.ot3

    summary.innerHTML=`
<table class="w-full border text-center">
<tr class="bg-gray-200">
<th>วันที่</th><th>เข้า</th><th>ออก</th>
<th>OT1</th><th>OT1.5</th><th>OT3</th></tr>
${d.rows.map(r=>`
<tr><td>${r.date}</td><td>${r.in||"-"}</td><td>${r.out}</td>
<td>${r.ot1}</td><td>${r.ot15}</td><td>${r.ot3}</td></tr>`).join("")}
<tr class="font-bold bg-yellow-100">
<td colspan="3">รวม</td><td>${sum1}</td><td>${sum15}</td><td>${sum3}</td>
</tr></table>`
  })
}

/* ===== OT Money ===== */
function openCalc(){
  m_ot1.innerText=sum1
  m_ot15.innerText=sum15
  m_ot3.innerText=sum3
  calcModal.classList.remove("hidden")
}

function closeCalc(){
  calcModal.classList.add("hidden")
}

function calculateMoney(){
  const s=Number(salary.value)
  if(!s) return alert("กรอกเงินเดือน")

  const perHour=(s/26)/8
  const total =
    (perHour*sum1*1)+
    (perHour*sum15*1.5)+
    (perHour*sum3*3)

  total_ot.innerText = total.toFixed(2)
}

/* ===== Delete / Logout ===== */
function clearAll(){
  if(confirm("ล้าง OT ทั้งหมด ?"))
    fetch(`/delete_all/${username}`,{method:"DELETE"}).then(()=>alert("ล้างแล้ว"))
}

function logout(){
  localStorage.clear()
  location.replace("/")
}
</script>
</body>
</html>
